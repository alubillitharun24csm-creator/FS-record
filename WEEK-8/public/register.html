<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | CareQueue</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand"><span class="plus">+</span> CareQueue</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/register">Register</a>
      <a href="/login">Login</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Patient Registration</h2>
      <p class="subtitle">Fill in your details to create your CareQueue patient account.</p>

      <div id="regMessage" class="message"></div>

      <form id="registerForm">
        <div class="form-grid">
          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" max="120" required />
          </div>
          <div class="field">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required />
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Select</option>
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" required />
          </div>
          <div class="field">
            <label for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" name="bloodGroup" required>
              <option value="">Select</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
          <div class="field">
            <label for="emergencyContact">Emergency Contact Number</label>
            <input type="tel" id="emergencyContact" name="emergencyContact" required />
          </div>
          <div class="field">
            <label for="preferredDepartment">Preferred Department</label>
            <select id="preferredDepartment" name="preferredDepartment" required>
              <option value="">Select</option>
              <option>General Medicine</option>
              <option>Cardiology</option>
              <option>Orthopedics</option>
              <option>Pediatrics</option>
              <option>Dermatology</option>
              <option>ENT</option>
            </select>
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div class="field full">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="2" required></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <p class="form-footer">Already have an account? <a href="/login">Login here</a></p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
